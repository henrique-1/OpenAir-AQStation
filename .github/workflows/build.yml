name: Build PlatformIO Firmware (ESP32 DOIT DevKit v1)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar GitHub Release mesmo sem tag de versão'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Compilar Firmware ESP32 DOIT DevKit (CH9102X / WROOM-32)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO CLI e esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Cache de Dependências PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Compilar Firmware
        run: pio run -e esp32doit-devkit-v1

      - name: Preparar Pacote de Artefatos para Release
        run: python tools/prepare_release.py

      - name: Publicar Artefato de Release (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenAir-AQStation-ESP32-Release
          path: |
            release/*
          if-no-files-found: error
          retention-days: 90

      - name: Publicar Release no GitHub (GitHub Releases)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.bin
            release/INSTRUCOES_GRAVACAO.txt
            release/flash.sh
            release/flash.bat
          body_path: release/RELEASE_NOTES.md
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || format('Release v1.0.{0}', github.run_number) }}
          generate_release_notes: false
          draft: false
          prerelease: false
